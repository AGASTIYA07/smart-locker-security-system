<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="inGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="telGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)"/>
  
  <!-- Header -->
  <text x="600" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">SMART LOCKER SECURITY SYSTEM — ARCHITECTURE</text>
  <text x="600" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">Embedded Dual-Factor Authentication &amp; Hardware Telemetry</text>

  <!-- Section 1: Inputs -->
  <rect x="40" y="110" width="280" height="520" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="110" width="280" height="44" rx="16" fill="url(#inGrad)"/>
  <rect x="40" y="140" width="280" height="14" fill="url(#inGrad)"/>
  <text x="180" y="140" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">INPUT DEVICES &amp; SENSORS</text>

  <!-- Input Nodes -->
  <!-- Keypad -->
  <rect x="60" y="175" width="240" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="202" font-family="sans-serif" font-size="15" font-weight="700" fill="#f59e0b">4x4 Matrix Keypad</text>
  <text x="75" y="224" font-family="sans-serif" font-size="12" fill="#cbd5e1">- 4-Digit Password Entry</text>
  <text x="75" y="242" font-family="sans-serif" font-size="12" fill="#cbd5e1">- 60s Dynamic OTP Entry</text>
  <text x="75" y="258" font-family="sans-serif" font-size="11" fill="#94a3b8">Pins: D2, D3, D4, D5, D6, D7, D8, D9</text>

  <!-- Door Switch -->
  <rect x="60" y="280" width="240" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="307" font-family="sans-serif" font-size="15" font-weight="700" fill="#f59e0b">Door Contact Switch</text>
  <text x="75" y="328" font-family="sans-serif" font-size="12" fill="#cbd5e1">- Magnetic Reed / SPDT</text>
  <text x="75" y="346" font-family="sans-serif" font-size="12" fill="#cbd5e1">- Real-Time Tamper &amp; Pry Detection</text>
  <text x="75" y="360" font-family="sans-serif" font-size="11" fill="#94a3b8">Pin: A1 (Internal Pullup)</text>

  <!-- PIR Motion -->
  <rect x="60" y="380" width="240" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="407" font-family="sans-serif" font-size="15" font-weight="700" fill="#f59e0b">HC-SR501 PIR Sensor</text>
  <text x="75" y="428" font-family="sans-serif" font-size="12" fill="#cbd5e1">- Infrared Motion Detection</text>
  <text x="75" y="446" font-family="sans-serif" font-size="12" fill="#cbd5e1">- Loitering &amp; Proximity Alert</text>
  <text x="75" y="460" font-family="sans-serif" font-size="11" fill="#94a3b8">Pin: A2 (Digital Input)</text>

  <!-- Analog Noise -->
  <rect x="60" y="480" width="240" height="85" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="507" font-family="sans-serif" font-size="15" font-weight="700" fill="#f59e0b">Atmospheric Noise Seed</text>
  <text x="75" y="528" font-family="sans-serif" font-size="12" fill="#cbd5e1">- Floating Analog Voltage</text>
  <text x="75" y="546" font-family="sans-serif" font-size="12" fill="#cbd5e1">- True Hardware Entropy for OTP</text>
  <text x="75" y="560" font-family="sans-serif" font-size="11" fill="#94a3b8">Pin: A3 (Unconnected)</text>

  <!-- Section 2: Central Processing Unit -->
  <rect x="440" y="110" width="320" height="520" rx="16" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="110" width="320" height="44" rx="16" fill="url(#mcuGrad)"/>
  <rect x="440" y="140" width="320" height="14" fill="url(#mcuGrad)"/>
  <text x="600" y="140" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">CENTRAL CONTROLLER</text>

  <!-- Microcontroller Main Box -->
  <rect x="460" y="175" width="280" height="430" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="208" font-family="sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="middle">ARDUINO UNO</text>
  <text x="600" y="228" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">ATmega328P (16 MHz AVR)</text>
  
  <!-- Sub-modules inside MCU -->
  <rect x="475" y="245" width="250" height="65" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="490" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9">Dynamic OTP Engine</text>
  <text x="490" y="290" font-family="sans-serif" font-size="11" fill="#94a3b8">Entropy seed + 60s Countdown Timer</text>
  <text x="490" y="303" font-family="sans-serif" font-size="10" fill="#64748b">randomSeed(analogRead(A3))</text>

  <rect x="475" y="320" width="250" height="65" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="490" y="345" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9">Duress Robbery Logic</text>
  <text x="490" y="365" font-family="sans-serif" font-size="11" fill="#94a3b8">PIN 9999# Silent Police Dispatch</text>
  <text x="490" y="378" font-family="sans-serif" font-size="10" fill="#64748b">Stealth Alarm without Audible Siren</text>

  <rect x="475" y="395" width="250" height="65" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="490" y="420" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9">Internal EEPROM Storage</text>
  <text x="490" y="440" font-family="sans-serif" font-size="11" fill="#94a3b8">Master &amp; Admin PIN Persistence</text>
  <text x="490" y="453" font-family="sans-serif" font-size="10" fill="#64748b">Magic Flag 0xAA Integrity Check</text>

  <rect x="475" y="470" width="250" height="65" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="490" y="495" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9">SRAM Flash Optimizer</text>
  <text x="490" y="515" font-family="sans-serif" font-size="11" fill="#94a3b8">F() Macro PROGMEM Storage</text>
  <text x="490" y="528" font-family="sans-serif" font-size="10" fill="#64748b">SRAM Footprint Reduced by 95%</text>

  <rect x="475" y="545" width="250" height="50" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="490" y="568" font-family="sans-serif" font-size="12" font-weight="700" fill="#67e8f9">Locker Inactivity Monitor</text>
  <text x="490" y="584" font-family="sans-serif" font-size="10" fill="#94a3b8">2-Minute Open Alert &amp; '#' Lock Trigger</text>

  <!-- Section 3: Outputs & Actuators -->
  <rect x="880" y="110" width="280" height="360" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="880" y="110" width="280" height="44" rx="16" fill="url(#outGrad)"/>
  <rect x="880" y="140" width="280" height="14" fill="url(#outGrad)"/>
  <text x="1020" y="140" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">OUTPUTS &amp; ACTUATORS</text>

  <!-- 1602 LCD -->
  <rect x="900" y="175" width="240" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="915" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">1602 LCD (I2C Backpack)</text>
  <text x="915" y="218" font-family="sans-serif" font-size="11" fill="#cbd5e1">Pins: A4 (SDA), A5 (SCL) [Addr 0x27]</text>

  <!-- SG90 Servo -->
  <rect x="900" y="245" width="240" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="915" y="268" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">SG90 Servo Deadbolt</text>
  <text x="915" y="288" font-family="sans-serif" font-size="11" fill="#cbd5e1">Pin: D10 (PWM) | 0° Locked / 90° Open</text>

  <!-- Buzzer -->
  <rect x="900" y="315" width="240" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="915" y="338" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">Piezo Buzzer (Audio)</text>
  <text x="915" y="358" font-family="sans-serif" font-size="11" fill="#cbd5e1">Pin: D11 | Key clicks &amp; Tamper Sirens</text>

  <!-- LEDs -->
  <rect x="900" y="385" width="240" height="65" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="915" y="408" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">Status LEDs (Tri-Color)</text>
  <text x="915" y="426" font-family="sans-serif" font-size="11" fill="#cbd5e1">D12: Red (Locked) | D13: Green (Open)</text>
  <text x="915" y="442" font-family="sans-serif" font-size="11" fill="#cbd5e1">A0: Yellow (OTP Countdown Mode)</text>

  <!-- Section 4: Telemetry -->
  <rect x="880" y="490" width="280" height="140" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="880" y="490" width="280" height="40" rx="16" fill="url(#telGrad)"/>
  <rect x="880" y="520" width="280" height="10" fill="url(#telGrad)"/>
  <text x="1020" y="517" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">COMMUNICATION &amp; GSM</text>

  <rect x="900" y="540" width="240" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="915" y="563" font-family="sans-serif" font-size="14" font-weight="700" fill="#a78bfa">Virtual GSM / SIM800L</text>
  <text x="915" y="583" font-family="sans-serif" font-size="11" fill="#cbd5e1">UART Pins: D0 (RX), D1 (TX)</text>
  <text x="915" y="600" font-family="sans-serif" font-size="11" fill="#cbd5e1">SMS OTPs &amp; Police Duress Telemetry</text>

  <!-- Arrows -->
  <!-- Inputs to MCU -->
  <path d="M 320 220 L 440 220" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 322 L 440 322" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 422 L 440 422" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 522 L 440 522" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- MCU to Outputs -->
  <path d="M 760 205 L 880 205" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 275 L 880 275" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 345 L 880 345" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 415 L 880 415" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- MCU to Telemetry -->
  <path d="M 760 560 L 880 560" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
